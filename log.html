      --coral: #e85d4f;

      --ink-700: #4a423b;
      --ink-500: #6b6259;
      --ink-400: #a39a8f;
      --success: #4a7c4a;
      --danger: #c85450;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--sand-50); color: var(--ink-900); }

      line-height: 1.6;

      margin: 0 auto;
      padding: 0 0 60px;
      min-height: 100vh;
    }
    .hero {
      background: linear-gradient(135deg, var(--ocean-900), var(--ocean-700));
      color: white;
      padding: 32px 20px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%; left: -20%;
      width: 140%; height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(212,165,116,0.15), transparent 50%),

      pointer-events: none;

    .hero-content { position: relative; z-index: 1; }

    .hero-sub { font-size: 13px; opacity: 0.85; }

    .hero-stat-num { font-size: 22px; font-weight: 700; color: var(--gold); }

    .tabs { display: flex; background: white; border-bottom: 1px solid var(--sand-200); position: sticky; top: 0; z-index: 100; }

    .tab.active { color: var(--ocean-900); font-weight: 600; border-bottom-color: var(--coral); }
    .panel { display: none; padding: 16px; }
    .panel.active { display: block; }

    .region-heading { font-size: 11px; color: var(--ocean-700); letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; margin: 24px 4px 10px; display: flex; align-items: center; gap: 8px; }
    .region-heading::before { content: ''; flex-shrink: 0; width: 20px; height: 2px; background: var(--gold); }
    .region-heading:first-of-type { margin-top: 8px; }

    .day-card { background: white; border-radius: 16px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,58,62,0.05); border: 1px solid var(--sand-200); }
    .day-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: linear-gradient(135deg, var(--sand-100), var(--sand-50)); border-bottom: 1px solid var(--sand-200); }
    .day-num { background: var(--ocean-900); color: white; border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }
    .day-date { font-size: 15px; font-weight: 700; color: var(--ocean-900); }
    .day-date sup { font-size: 11px; color: var(--coral); margin-left: 2px; font-weight: 600; }
    .day-title { flex: 1; font-size: 13px; color: var(--ink-700); font-weight: 500; }
    .day-move-badge { background: var(--coral); color: white; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 600; letter-spacing: 0.5px; }
    .day-body { padding: 14px 16px; }

    /* === PHOTO SLIDER === */
    .photo-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      gap: 8px;
      margin: 0 -16px 12px;
      padding: 0 16px 4px;
      -webkit-overflow-scrolling: touch;
    }
    .photo-slider::-webkit-scrollbar { display: none; }
    .photo-slide {
      flex: 0 0 88%;
      scroll-snap-align: center;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: var(--sand-100);
      aspect-ratio: 4/3;
    }
    .photo-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-slide-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7));
      color: white;
      padding: 20px 12px 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .photo-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(15,58,62,0.9);
      color: white;
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-weight: 500;

    .photo-album-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ocean-700);
      text-decoration: none;
      padding: 6px 10px;
      background: var(--sand-100);
      border-radius: 8px;
      margin-top: 8px;
      font-weight: 500;
      transition: background 0.15s;

    .photo-album-link:hover { background: var(--sand-200); }

    .timeline { display: grid; gap: 8px; }
    .timeline-item { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: baseline; font-size: 13px; line-height: 1.55; }
    .timeline-time { font-family: 'JetBrains Mono', 'Menlo', monospace; font-size: 11.5px; color: var(--ocean-700); font-weight: 600; padding-top: 1px; }
    .timeline-text { color: var(--ink-900); }
    .timeline-item.highlight .timeline-text { background: linear-gradient(180deg, transparent 60%, rgba(212,165,116,0.35) 60%); font-weight: 500; }
    .timeline-item.meta .timeline-text { color: var(--ink-500); font-size: 12px; }

    .day-spend { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--sand-200); display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-500); }

    .day-spend-num { color: var(--ocean-900); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

    .album-cta-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }

</head>

    function renderDays() {
      const cont = document.getElementById('daysContainer');
      const groups = [];
      let cur = null;
      for (const day of tripLog) {
        if (!cur || cur.region !== day.region) {
          cur = { region: day.region, days: [] };
          groups.push(cur);
        }
        cur.days.push(day);
      }
      cont.innerHTML = groups.map(g => `
        <div class="region-heading">${g.region}</div>
        ${g.days.map(renderDayCard).join('')}
      `).join('');
    }

    function renderDayCard(day) {
      const tl = day.timeline.map(item => `
        <div class="timeline-item ${item.hi ? 'highlight' : ''} ${item.meta ? 'meta' : ''}">
          <div class="timeline-time">${item.t}</div>
          <div class="timeline-text">${item.text}</div>
        </div>
      `).join('');

      // 사진 슬라이더
      const hasPhotos = day.photos && day.photos.length > 0;
      const sliderHtml = hasPhotos ? `
        <div class="photo-count-badge">📷 ${day.photos.length}장</div>
        <div class="photo-slider">
          ${day.photos.map(p => `
            <div class="photo-slide">
              <img src="${p.src}" alt="${p.caption || ''}" loading="lazy">
              ${p.caption ? `<div class="photo-slide-caption">${p.caption}</div>` : ''}
            </div>
          `).join('')}
        </div>
      ` : '';

      // 이 날의 앨범 링크 (선택)
      const albumLink = day.photoAlbum ? `
        <a href="${day.photoAlbum}" target="_blank" rel="noopener" class="photo-album-link">
          🖼️ 이 날 사진 전체 보기
        </a>
      ` : '';

      return `
        <div class="day-card" data-date="${day.date}">
          <div class="day-head">
            <div class="day-num">Day ${day.num}</div>
            <div class="day-date">${day.date.slice(5,7)}.${day.date.slice(8,10)}<sup>${day.wk}</sup></div>
            <div class="day-title">${day.title}</div>
            ${day.move ? '<span class="day-move-badge">이동</span>' : ''}
          </div>
          <div class="day-body">
            ${sliderHtml}
            <div class="timeline">${tl}</div>
            ${albumLink}
            <div class="day-spend" data-date-spend="${day.date}" style="display:none;">
              <div class="day-spend-label">💰 이 날 지출</div>
              <div class="day-spend-num">-</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderHighlights() {
      document.getElementById('highlightsContainer').innerHTML = highlights.map(h => `
        <div class="hl-card">
          <div class="hl-icon">${h.icon}</div>
          <div>
            <div class="hl-meta">${h.meta}</div>
            <div class="hl-title">${h.title}</div>
            <div class="hl-desc">${h.desc}</div>
          </div>
        </div>
      `).join('');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        window.scrollTo(0, 0);
      });
    });

    // === Firebase 가계부 ===
    const CATEGORIES = [
      { id: 'food', icon: '🍽️', label: '식비' },
      { id: 'transit', icon: '🚗', label: '교통' },
      { id: 'activity', icon: '🎢', label: '액티비티' },
      { id: 'shopping', icon: '🛍️', label: '쇼핑' },
      { id: 'spa', icon: '💆', label: '마사지' },
      { id: 'tip', icon: '💵', label: '팁' },
      { id: 'mart', icon: '🛒', label: '편의·약' },
      { id: 'etc', icon: '📦', label: '기타' },
    ];
    const RATE = 0.08;
    function formatNum(n) { return Math.round(n).toLocaleString('ko-KR'); }
    function getKRW(e) { return e.currency === 'KRW' ? e.amount : e.amount * RATE; }

    function renderExpense(entries) {
      const total = entries.reduce((s, e) => s + getKRW(e), 0);
      document.getElementById('expenseTotal').textContent = `₩${formatNum(total)}`;
      const uniqueDays = new Set(entries.map(e => e.date)).size;
      document.getElementById('expenseSub').textContent = `${entries.length}건 · ${uniqueDays}일 · 환율 ${RATE}`;

      // hero stat
      const totalMan = Math.round(total / 10000);
      document.getElementById('statSpend').textContent = `${totalMan}만`;

      // 카테고리
      const catMap = {};
      for (const e of entries) {
        const krw = getKRW(e);
        if (!catMap[e.cat]) catMap[e.cat] = { count: 0, sum: 0 };
        catMap[e.cat].count++;
        catMap[e.cat].sum += krw;
      }
      const catList = CATEGORIES.map(c => ({ ...c, ...(catMap[c.id] || {}) }))
        .filter(c => c.count > 0)
        .sort((a, b) => b.sum - a.sum);
      document.getElementById('expenseCats').innerHTML = catList.map(c => `
        <div class="expense-cat">
          <div class="expense-cat-head"><span class="expense-cat-icon">${c.icon}</span> ${c.label}</div>
          <div class="expense-cat-num">₩${formatNum(c.sum)}</div>
          <div class="expense-cat-sub">${c.count}건</div>
        </div>
      `).join('');

      // 일별 표시
      const dayMap = {};
      for (const e of entries) {
        if (!dayMap[e.date]) dayMap[e.date] = 0;
        dayMap[e.date] += getKRW(e);
      }
      document.querySelectorAll('[data-date-spend]').forEach(el => {
        const date = el.dataset.dateSpend;
        if (dayMap[date]) {
          el.style.display = 'flex';
          el.querySelector('.day-spend-num').textContent = `₩${formatNum(dayMap[date])}`;
        }
      });
    }

    function loadExpense() {
      if (!tripCode) {
        document.getElementById('expenseTotal').textContent = '-';
        document.getElementById('expenseSub').textContent = 'URL에 ?trip=XXX 필요';
        return;
      }
      const attach = () => {
        const fb = window.firebaseDB;
        if (!fb) return;
        const { db, collection, onSnapshot } = fb;
        const col = collection(db, 'trips', tripCode, 'entries');
        onSnapshot(col, (snap) => {
          const entries = [];
          snap.forEach(d => entries.push(d.data()));
          renderExpense(entries);
        }, (err) => {
          console.log('Firestore load failed:', err);
          document.getElementById('expenseSub').textContent = '로드 실패 · ' + err.message;
        });
      };
      if (window.firebaseDB) attach();
      else window.addEventListener('firebase-ready', attach, { once: true });
    }

    renderDays();
    renderHighlights();
    loadExpense();

    // Google Photos 앨범 링크 활성화
    if (TRIP_ALBUM_URL) {
      const link = document.getElementById('tripAlbumLink');
      link.href = TRIP_ALBUM_URL;
      link.style.display = 'block';
    }
  </script>
